name: Release Builds

on:
  push:
    tags:
      - "v*"
  # Manual, build-only runs. A dispatch builds all three platforms and leaves
  # the artifacts attached to the run, but SKIPS the publish job (see the `if`
  # on `release` below) — so a tester can be handed a real macOS/Windows build
  # to try without a version being cut and pushed to the public releases repo.
  # Added 2026-09-06: the macOS `--wid` fix needed dogfooding on a clean Mac,
  # and the alternatives were both bad — publish a release nobody had verified,
  # or talk a non-developer through installing a Python toolchain.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # ---------------------------------------------------------------------------
  # Windows build
  # ---------------------------------------------------------------------------
  build-windows:
    name: Build — Windows
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Fetch libmpv-2.dll from shinchiro mpv-dev release
        shell: pwsh
        env:
          # AUTHENTICATE the API call. Unauthenticated api.github.com allows 60
          # requests per hour PER IP, and Actions runners share their egress
          # IPs with every other job on the fleet — so this step failed with
          # "API rate limit exceeded for <ip>" purely by luck of timing. It
          # succeeded for v0.1.21-alpha and failed twelve minutes later for
          # v0.1.22-alpha with no change to the workflow. GITHUB_TOKEN raises
          # the limit to 1000/hr for this repository and removes the dependency
          # on a stranger's traffic; reading another repo's public releases
          # needs no extra scope.
          GH_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ProgressPreference = "SilentlyContinue"
          $headers = @{
            "Authorization" = "Bearer $env:GH_API_TOKEN"
            "Accept"        = "application/vnd.github+json"
            "User-Agent"    = "forgeplayer-ci"
          }
          # Retry anyway: an authenticated limit is still a limit, and a
          # transient 5xx from the API should not fail a release build.
          $release = $null
          foreach ($attempt in 1..4) {
            try {
              $release = Invoke-RestMethod -Headers $headers `
                -Uri "https://api.github.com/repos/shinchiro/mpv-winbuild-cmake/releases/latest"
              break
            } catch {
              Write-Host "API attempt $attempt failed: $($_.Exception.Message)"
              if ($attempt -eq 4) { throw }
              Start-Sleep -Seconds (5 * $attempt)
            }
          }
          $asset = $release.assets |
            Where-Object { $_.name -like "mpv-dev-x86_64-2*" } |
            Select-Object -First 1
          if (-not $asset) {
            $asset = $release.assets |
              Where-Object { $_.name -like "mpv-dev-x86_64*" } |
              Select-Object -First 1
          }
          Write-Host "Downloading $($asset.name)"
          $tmp = "$env:RUNNER_TEMP\mpv-dev.7z"
          Invoke-WebRequest -Uri $asset.browser_download_url -OutFile $tmp
          7z e $tmp -o"$env:GITHUB_WORKSPACE" "libmpv-2.dll" -y
          if (-not (Test-Path "$env:GITHUB_WORKSPACE\libmpv-2.dll")) {
            Write-Error "libmpv-2.dll not extracted from $($asset.name) — the asset layout may have changed upstream"
            exit 1
          }

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller pytest Pillow

      - name: Run tests
        shell: pwsh
        run: |
          # libmpv-2.dll was extracted to the workspace root, but python-mpv
          # resolves it off %PATH% — not the working directory. Without this
          # the tests that import PlayerWindow/ControlWindow skip themselves.
          $env:PATH = "$env:GITHUB_WORKSPACE;$env:PATH"
          python -m pytest tests/ -q

      - name: Build with PyInstaller
        run: pyinstaller ForgePlayer.spec --noconfirm --clean

      - name: Verify build
        shell: pwsh
        run: |
          if (-not (Test-Path "dist\ForgePlayer\ForgePlayer.exe")) {
            Write-Error "Build artifact not found"
            exit 1
          }

      - name: Build Windows installer (NSIS)
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $ver = $tag -replace '^v',''
          if (-not $ver) { $ver = "0.0.0" }
          # NSIS is NOT preinstalled on windows-latest — install it (Chocolatey
          # ships on the runner). makensis lands in Program Files (x86)\NSIS.
          choco install nsis -y --no-progress
          $nsis = "${env:ProgramFiles(x86)}\NSIS\makensis.exe"
          if (-not (Test-Path $nsis)) {
            $cmd = Get-Command makensis -ErrorAction SilentlyContinue
            if ($cmd) { $nsis = $cmd.Source }
          }
          if (-not (Test-Path $nsis)) { Write-Error "makensis not found after install"; exit 1 }
          # Pass the absolute repo root so the .nsi uses absolute asset paths
          # (NSIS resolves relative paths against the script dir, not CWD).
          $root = (Get-Location).Path
          Write-Host "makensis: $nsis  version: $ver  root: $root"
          & "$nsis" "/DVERSION=$ver" "/DROOTDIR=$root" "installer\forgeplayer.nsi"
          if ($LASTEXITCODE -ne 0) { Write-Error "makensis failed"; exit 1 }
          if (-not (Test-Path "dist\ForgePlayer-Setup.exe")) {
            Write-Error "Installer not produced"
            exit 1
          }

      - name: Zip artifact
        shell: pwsh
        run: Compress-Archive -Path dist\ForgePlayer -DestinationPath dist\ForgePlayer-windows.zip

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ForgePlayer-windows
          path: |
            dist/ForgePlayer-windows.zip
            dist/ForgePlayer-Setup.exe

  # ---------------------------------------------------------------------------
  # macOS build
  # ---------------------------------------------------------------------------
  build-macos:
    name: Build — macOS
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install libmpv via Homebrew
        run: brew install mpv

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller pytest

      - name: Generate .icns icon
        run: |
          ICO_SRC="branding/forgeplayer_icon.png"
          ICNS_OUT="branding/forgeplayer.icns"
          if [ -f "$ICO_SRC" ] && [ ! -f "$ICNS_OUT" ]; then
            ICONSET_DIR="$(mktemp -d)/ForgePlayer.iconset"
            mkdir -p "$ICONSET_DIR"
            for SIZE in 16 32 64 128 256 512; do
              sips -z "$SIZE" "$SIZE" "$ICO_SRC" --out "$ICONSET_DIR/icon_${SIZE}x${SIZE}.png" 2>/dev/null
              DOUBLE=$((SIZE * 2))
              sips -z "$DOUBLE" "$DOUBLE" "$ICO_SRC" --out "$ICONSET_DIR/icon_${SIZE}x${SIZE}@2x.png" 2>/dev/null
            done
            iconutil -c icns "$ICONSET_DIR" -o "$ICNS_OUT"
            rm -rf "$(dirname "$ICONSET_DIR")"
          fi

      - name: Run tests
        run: |
          # ctypes' find_library honours DYLD_FALLBACK_LIBRARY_PATH; the brew
          # prefix is /opt/homebrew on arm64 runners, which dyld won't search
          # on its own.
          export DYLD_FALLBACK_LIBRARY_PATH="$(brew --prefix)/lib:${DYLD_FALLBACK_LIBRARY_PATH:-/usr/local/lib:/usr/lib}"
          python -m pytest tests/ -q

      - name: Build with PyInstaller
        run: pyinstaller ForgePlayer.spec --noconfirm --clean

      - name: Verify build
        run: |
          if [ ! -d "dist/ForgePlayer.app" ] && [ ! -d "dist/ForgePlayer" ]; then
            echo "Build artifact not found"
            exit 1
          fi

      - name: Zip artifact
        run: |
          cd dist
          if [ -d "ForgePlayer.app" ]; then
            # `ditto`, not `zip -r`. A macOS .app carries symlinks (Qt
            # frameworks use Versions/Current -> A, and the framework's own
            # name -> Versions/Current/<name>). Plain `zip -r` has no -y, so
            # it FOLLOWS those links and stores a full copy of each target:
            # the archive balloons and the framework layout is no longer the
            # structure dyld and codesign expect. ditto is Apple's own tool
            # for archiving bundles and preserves symlinks, resource forks
            # and permissions.
            ditto -c -k --sequesterRsrc --keepParent ForgePlayer.app ForgePlayer-macos.zip
          else
            zip -ry ForgePlayer-macos.zip ForgePlayer
          fi

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: ForgePlayer-macos
          path: dist/ForgePlayer-macos.zip

  # ---------------------------------------------------------------------------
  # Linux build
  # ---------------------------------------------------------------------------
  build-linux:
    name: Build — Linux
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install system dependencies (libmpv + Qt runtime bits)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libmpv2 \
            libmpv-dev \
            libxcb-cursor0 \
            libxcb-xinerama0 \
            libxcb-icccm4 \
            libxcb-image0 \
            libxcb-keysyms1 \
            libxcb-randr0 \
            libxcb-render-util0 \
            libxcb-shape0 \
            libxcb-sync1 \
            libxcb-xfixes0 \
            libxkbcommon-x11-0 \
            libegl1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller pytest

      - name: Run tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest tests/ -q

      - name: Build with PyInstaller
        env:
          QT_QPA_PLATFORM: offscreen
        run: pyinstaller ForgePlayer.spec --noconfirm --clean

      - name: Verify build
        run: |
          if [ ! -f "dist/ForgePlayer/ForgePlayer" ]; then
            echo "Build artifact not found"
            exit 1
          fi

      - name: Create tarball
        run: tar -czf dist/ForgePlayer-linux.tar.gz -C dist ForgePlayer

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: ForgePlayer-linux
          path: dist/ForgePlayer-linux.tar.gz

  # ---------------------------------------------------------------------------
  # Publish a GitHub Release with all three artifacts
  # ---------------------------------------------------------------------------
  release:
    name: Publish Release
    needs: [build-windows, build-macos, build-linux]
    runs-on: ubuntu-latest
    # Tag pushes publish; manual dispatches only build. Without this guard a
    # workflow_dispatch would cut a release from whatever ref it ran on.
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: ForgePlayer-windows
          path: artifacts/

      - name: Download macOS artifact
        uses: actions/download-artifact@v4
        with:
          name: ForgePlayer-macos
          path: artifacts/

      - name: Download Linux artifact
        uses: actions/download-artifact@v4
        with:
          name: ForgePlayer-linux
          path: artifacts/

      - name: Compute release name
        id: relname
        run: |
          TAG="${GITHUB_REF_NAME}"
          STRIPPED="${TAG#v}"
          NAME="ForgePlayer ${STRIPPED//-/ }"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          repository: liquid-releasing/forgeplayer-releases
          token: ${{ secrets.RELEASES_PAT }}
          name: ${{ steps.relname.outputs.name }}
          # Full "Latest" release on GitHub so the website's /releases/latest
          # download buttons resolve to it. Beta status is conveyed by the
          # site's "Pre-release software" note + the body banner below, not by
          # GitHub's prerelease flag (which would hide the cut from /latest).
          prerelease: false
          files: |
            artifacts/ForgePlayer-Setup.exe
            artifacts/ForgePlayer-windows.zip
            artifacts/ForgePlayer-macos.zip
            artifacts/ForgePlayer-linux.tar.gz
          body: |
            > ⚠️ **Pre-1.0 development release.** Active development; expect rough edges.

            ForgePlayer is a synchronized multi-screen player with per-port device routing. Drop a FunscriptForge or ForgeAssembler scene pack into the Library and ForgePlayer plays it across your screens — with audio routed separately to scene speakers, your Haptic 1 stim port, and (optionally) a Haptic 2 prostate port — all from the same timeline.

            **What's new since the last cut:**
            - **Browse works again.** In v0.1.22 the **Browse…** buttons were broken outright: picking a funscript or an audio file did nothing at all, and — because the fault was inside the logging added that same release — it left no trace in the debug log either. That combination is why it read like an old build. Fixed, with the entry point now covered by tests. If you tried Browse in v0.1.22 and concluded it didn't work, you were right.
            - **Your device settings stop disappearing.** A saved audio device that wasn't connected at startup — a sleeping TV over HDMI, an unplugged dongle, disconnected Bluetooth — silently read as "not set", and then the *next* change you made to any other setting wrote that emptiness back to disk. A role you never touched lost its device permanently. The picker now shows the remembered device marked **— not connected** and keeps it until you change it yourself.
            - **ForgePlayer no longer writes files into your media folders.** Every scene you opened dropped a `<scene>.forgeplayer.json` beside your video. Those remembered your picks, so they weren't junk — but they weren't ours to put there. Pins now live in `~/.forgeplayer/pins/`. Existing ones are moved there automatically the next time you open the scene, so nothing is forgotten and your library tidies itself as you browse it.
            - **A stim source picked with Browse is remembered, and shown.** Browsing to a funscript or mp3 outside the scene's folder used to be forgotten as soon as you left the scene. Now it persists — and the picker lists it alongside the scene's own files instead of claiming nothing is selected.
            - **A scene with an mp3 next to it plays it.** If a scene had been opened before its stim audio existed, it kept replaying "no stim" forever while an untouched scene in the same library found its audio fine.
            - **Scanning a big library looks like it's working.** Pointing the Library at a large or external drive can take minutes. The cursor now spins for the duration and the status line names the folder, instead of sitting silent and looking stuck. It is not faster yet — that's next.
            - **Debug capture is off by default again.** It was switched on for the last three releases to chase specific reports, which are now fixed. Tick **Debug** before reproducing a problem when we ask for a log; the Settings page explains where the files land and which to send.

            **Device compatibility:** ForgePlayer drives **e-stim** — 2b and stereostim boxes — from either pre-rendered stim audio (mp3/wav) or live funscript synthesis (vendored restim), with each box on its own USB audio dongle. FOC-Stim scenes play through their pulse parameters; the 4-phase electrode and gamma outputs are recognized but **not yet driven**. Mechanical toys (strokers, Handy, Keon, OSR) are **not** driven either: ForgePlayer recognizes a scene's motion track but has no output path for it. Subwoofer / bass-shaker output does not exist yet.

            ## Downloads
            - **Windows (installer, recommended)** — `ForgePlayer-Setup.exe` — installs ForgePlayer and registers `.forge` bundles so a double-click opens them in the player
            - **Windows (portable)** — `ForgePlayer-windows.zip` — unzip and run `ForgePlayer.exe`
            - **macOS** — `ForgePlayer-macos.zip` — unzip and open `ForgePlayer.app`. Nothing else to install. macOS will refuse to open it the first time, because the app isn't signed by an Apple developer account. On macOS 15 and later the warning offers only *Move to Trash* and *Done* — **right-clicking and choosing Open no longer works**. Take **Done**, then go to **System Settings → Privacy & Security**, scroll to the message naming ForgePlayer, and press **Open Anyway**. You only do this once.
            - **Linux** — `ForgePlayer-linux.tar.gz` — extract and run `ForgePlayer/ForgePlayer`. **Untested.** It builds and it's here if you want to try it, but nobody has dogfooded a Linux build yet, so it isn't offered on the website and we won't call it supported until it has been. Reports welcome.

            **First run — do Setup first.** The app opens on the Library, but nothing can route until your devices are assigned. Go to **Setup**, pick your Scene audio and Haptic 1 devices (and Haptic 2 if you have a second stim dongle), and press **🔊 Test** on each row to confirm the dongle is live. Then **Library → 📁 Root…** at your media folder, click a scene tile to activate it, and press Play.

            Questions, bug reports, and feedback welcome in [our Discord](https://discord.gg/UHdJFhEZF).
          append_body: true
          # Auto-prepend the commit/PR list since the previous tag.
          # Cross-project policy (FA, FunscriptForge, ForgeYT, FP) —
          # cheap per-version notes for minor releases; curated body
          # via CHANGELOG / tag-message for major/marketing releases.
          generate_release_notes: true

      - name: Notify forgeplayer-web to bump version badge
        env:
          GH_TOKEN: ${{ secrets.RELEASES_PAT }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          gh api \
            --method POST \
            -H "Accept: application/vnd.github+json" \
            /repos/liquid-releasing/forgeplayer-web/dispatches \
            -f event_type='release-published' \
            -f 'client_payload[tag]'="$TAG_NAME" \
            || echo "::warning::forgeplayer-web dispatch failed — repo may not exist yet. Badge will stay on previous version until next release."
